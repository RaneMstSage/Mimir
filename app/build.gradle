import groovy.json.JsonSlurper

plugins {
    id 'com.android.application' version '9.3.2'
}

def cfg = new JsonSlurper().parse(file("${rootDir}/mimir.config.json"))
def ver = (cfg.version ?: '0.0.0').toString()
def verParts = ver.tokenize('.').collect { it.toInteger() } + [0, 0, 0]
def releaseEnv = [:]
def envFile = file("${rootDir}/tools/release.env")
if (envFile.exists()) envFile.eachLine { l -> def kv = l.split('=', 2); if (kv.length == 2) releaseEnv[kv[0]] = kv[1] }

android {
    namespace 'com.mstsage.mimir'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mstsage.mimir'
        minSdk 26
        targetSdk 36
        versionCode verParts[0] * 10000 + verParts[1] * 100 + verParts[2]
        versionName ver
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets {
        main {
            manifest.srcFile "${rootDir}/build/gradle/AndroidManifest.xml"   // generated by bin/build.rb (no package attr)
            java.srcDirs = ["${rootDir}/android/src", "${rootDir}/android/src-billing"]   // src-billing: Gradle-only (Play Billing)
            res.srcDirs = ["${rootDir}/android/res"]
            assets.srcDirs = ["${rootDir}/build/stage/assets"]               // app.mrb, ui/
            jniLibs.srcDirs = ["${rootDir}/build/stage/lib"]                 // arm64-v8a/libmimir.so
        }
    }

    signingConfigs {
        // The tablet's debug key lives in tools/ (ignored by git) so debug builds there update in
        // place. Anywhere else, fall back to Android's standard auto-generated debug keystore.
        def localDebugKs = file("${rootDir}/tools/debug.keystore")
        if (localDebugKs.exists()) {
            debug {
                storeFile localDebugKs
                storePassword 'android'
                keyAlias 'inspect'
                keyPassword 'android'
            }
        }
        if (releaseEnv['MIMIR_KEYSTORE_PASS']) {
            release {
                storeFile file("${rootDir}/tools/release.keystore")
                storePassword releaseEnv['MIMIR_KEYSTORE_PASS']
                keyAlias releaseEnv['MIMIR_KEY_ALIAS'] ?: 'mimir'
                keyPassword releaseEnv['MIMIR_KEYSTORE_PASS']
            }
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseEnv['MIMIR_KEYSTORE_PASS']) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = true }    // extractNativeLibs=true, as the Ruby pipeline does
    }
}

// Ruby-side stages (bytecode, native library, Opal UI) run before every Gradle build so an IDE
// "Run" packages current artifacts. Each stage is incremental and returns quickly when nothing changed.
// Skipped when bin/build.rb itself invoked Gradle (it has already run them).
tasks.register('rubyStages', Exec) {
    workingDir rootDir
    commandLine 'ruby', "${rootDir}/bin/build.rb", 'mrb', 'native', 'opal'
    onlyIf { System.getenv('MIMIR_FROM_BUILD_RB') == null }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'rubyStages' }

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    // Play flags the old androidx.fragment that Play Services drags in; pin a current one.
    constraints {
        implementation('androidx.fragment:fragment') { version { require '1.9.0' } }
    }
}
